name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package (Unix)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/omni-rs-bin"
          [ -f "$BIN" ] || BIN="target/release/omni-rs-bin"
          cp "$BIN" .
          tar czf "omni-rs-${{ github.ref_name }}-${{ matrix.artifact }}.tar.gz" omni-rs-bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: omni-rs-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum omni-rs-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            omni-rs-*.tar.gz
            checksums.txt
